name: Build Voxy WorldGen

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # Copy the JAR to a clean folder so we can upload it nicely
      - name: Prepare Artifact
        run: |
          mkdir -p artifact
          cp Fabric/build/libs/*1.21.1*.jar artifact/ || cp **/build/libs/*.jar artifact/
          ls -la artifact/

      - name: Upload Clean JAR
        uses: actions/upload-artifact@v4
        with:
          name: Voxy-WorldGen-Fabric-1.21.1
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
